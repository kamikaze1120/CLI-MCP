name: Record demo GIF

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Publish tools image']
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: demo
  cancel-in-progress: true

jobs:
  record:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 20   # so the demo's `git log` shows real history

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cli-mcp from this checkout
        run: pip install -e .

      - name: Record with VHS
        uses: charmbracelet/vhs-action@v2
        with:
          path: demo/demo.tape

      # main is protected (PRs + CI only), so the GIF lives on its own branch,
      # like the profile snake. README references it via raw.githubusercontent.com.
      - name: Publish GIF to the assets branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: assets
          build_dir: docs
          keep_history: false
          commit_message: 'docs: refresh demo GIF'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Publish tools image

on:
  push:
    branches: [main]
    paths: ['Dockerfile', '.github/workflows/image.yml']
    tags: ['v*']
  pull_request:
    paths: ['Dockerfile', '.github/workflows/image.yml']   # build-only check, no push
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 so Apple Silicon Macs and ARM servers run it natively
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/cli-mcp-tools
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.title=cli-mcp-tools
            org.opencontainers.image.description=Sandbox image for CLI MCP Gateway: 50+ CLI tools for AI assistants

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  smoke-test:
    # Verify every tool the README advertises actually exists in the published image
    needs: publish
    if: github.event_name != 'pull_request'
    strategy:
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check advertised tools
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/cli-mcp-tools:sha-${GITHUB_SHA::7}
          docker run --rm "$IMAGE" bash -c '
            missing=0
            for t in git node npm python3 pip3 uv go rustc cargo java make gcc \
                     aws gcloud kubectl gh docker curl wget jq yq rg fdfind \
                     vim tmux ssh tar zip unzip; do
              if command -v "$t" >/dev/null; then echo "ok      $t"; else echo "MISSING $t"; missing=1; fi
            done
            echo "executables on PATH: $(compgen -c | sort -u | wc -l)"
            exit $missing'
